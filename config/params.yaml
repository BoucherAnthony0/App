data:
  raw_path: "data/raw/male_players.csv"
  fifa_version: 24.0

target:
  column: "value_eur"
  log_transform: true

features:
  numerical:
    - overall
    - potential
    - age
    - height_cm
    - weight_kg
    - weak_foot
    - skill_moves
    - international_reputation
    - pace
    - shooting
    - passing
    - dribbling
    - defending
    - physic
    - attacking_crossing
    - attacking_finishing
    - attacking_heading_accuracy
    - attacking_short_passing
    - attacking_volleys
    - skill_dribbling
    - skill_curve
    - skill_fk_accuracy
    - skill_long_passing
    - skill_ball_control
    - movement_acceleration
    - movement_sprint_speed
    - movement_agility
    - movement_reactions
    - movement_balance
    - power_shot_power
    - power_jumping
    - power_stamina
    - power_strength
    - power_long_shots
    - mentality_aggression
    - mentality_interceptions
    - mentality_positioning
    - mentality_vision
    - mentality_penalties
    - mentality_composure
    - defending_marking_awareness
    - defending_standing_tackle
    - defending_sliding_tackle
    - goalkeeping_diving
    - goalkeeping_handling
    - goalkeeping_kicking
    - goalkeeping_positioning
    - goalkeeping_reflexes
    - goalkeeping_speed
  categorical:
    - preferred_foot
    - work_rate
  engineered:
    - potential_gap  # potential - overall (scouting signal)

split:
  test_size: 0.2
  random_state: 42

# Évaluation robuste : validation croisée + optimisation d'hyperparamètres.
evaluation:
  cv_folds: 5                 # K-fold sur le TRAIN uniquement (pas de fuite)
  scoring: "neg_root_mean_squared_error"

tuning:
  enabled: true               # RandomizedSearchCV par modèle (mettre false pour aller vite)
  n_iter: 15                  # nb de combinaisons testées par modèle
  cv_folds: 3                 # CV interne de la recherche (plus court que l'éval)
  random_state: 42
  # Espaces de recherche (préfixe "model__" = étape "model" du pipeline sklearn).
  search_spaces:
    ridge:
      model__alpha: [0.1, 1.0, 10.0, 50.0, 100.0]
    random_forest:
      model__n_estimators: [100, 200, 300]
      model__max_depth: [10, 15, 20, null]
      model__min_samples_leaf: [1, 3, 5, 10]
    gradient_boosting:
      model__n_estimators: [200, 300, 500]
      model__learning_rate: [0.02, 0.05, 0.1]
      model__max_depth: [4, 6, 8]
    mlp:
      model__alpha: [0.0001, 0.001, 0.01]
      model__learning_rate_init: [0.001, 0.005]

models:
  ridge:
    alpha: 10.0
  random_forest:
    n_estimators: 200
    max_depth: 15
    min_samples_leaf: 5
    random_state: 42
    n_jobs: -1
  gradient_boosting:
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 6
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
    n_jobs: -1
  mlp:
    hidden_layer_sizes: [128, 64]
    activation: relu
    max_iter: 500
    early_stopping: true
    validation_fraction: 0.1
    n_iter_no_change: 20
    random_state: 42

paths:
  model_output: "models/best_model.joblib"
  reports_dir: "reports"
  figures_dir: "reports/figures"
  metrics_csv: "reports/metrics.csv"
